manifestVersion: 1
id: homelab-kinopeer
name: Kinopeer
tagline: Find movies and series, pick a release, download it with qBittorrent
icon: https://raw.githubusercontent.com/MrShakhov/umbrel-homelab-store/main/homelab-kinopeer/icon.svg
category: media
version: "1.3.0"
port: 8797
description: >-
  Kinopeer is a qBittorrent web UI built around movies and TV series. Find a
  title, pick a release found by Prowlarr and send it to qBittorrent, then
  follow the download, on your phone, where it installs as an app, or on a
  computer.


  Add your indexers in Prowlarr: Kinopeer finds them on its own, and connects
  to qBittorrent with Umbrel's default login (if you changed it, Kinopeer asks
  once).


  - **From a title to a release.** Resolution, source, HDR, voice-over and
  seasons are read from each release's name, and filters narrow the list down.


  - **Download only what you need.** Pick single files or seasons, and see
  beforehand whether they fit in the free space.


  - **Ready for your media server.** Name a movie's or a series' files the
  way Jellyfin and Plex expect, with `Title (Year)` folders and `S01E01`
  episodes, from a torrent's menu or right when adding it. qBittorrent
  keeps seeding them.


  - **Downloads as a film collection.** Each torrent shows its movie or series
  with a poster and a title instead of the release name.


  - **Managing torrents.** Pause, resume and delete torrents, several at once,
  and change file priorities, speed limits, categories and where the files go,
  without opening qBittorrent's own web UI.


  Kinopeer comes with no content and no indexers, and doesn't play video.
developer: MrShakhov
website: https://kinopeer.com
submitter: MrShakhov
submission: https://github.com/MrShakhov/umbrel-homelab-store
repo: https://github.com/kinopeer/kinopeer
support: https://github.com/kinopeer/kinopeer/issues
gallery: []
releaseNotes: >-
  Kinopeer can name a movie's or a series' files for a media server such as
  Jellyfin, from the torrent's menu or when adding, with the TMDB id in folder
  names as an option. When a download doesn't fit, the add sheet lists torrents
  to delete to free up space. A title's releases can be searched by an edited
  query and, for titles in other scripts, by their English name too, and each
  filter shows how many releases it would leave.
dependencies:
  - qbittorrent
  - prowlarr
path: ""
defaultUsername: ""
defaultPassword: ""
